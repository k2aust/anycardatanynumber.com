<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<title>Any Card At Any Number</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #181a21;
    --panel2: #1f222c;
    --line: #2b2f3b;
    --text: #e8e6e0;
    --dim: #8b8fa0;
    --gold: #e3b341;
    --red: #e05d5d;
    --green: #57c98a;
    --amber: #d98b3a;
    --radius: 14px;
    /* dup-tool surfaces — dark only (native palette) */
    --dd-page: #0e0f13;
    --dd-panel: #181a21;
    --dd-panel-label: #8b8fa0;
    --dd-surface: #181a21;
    --dd-surface-text: #e8e6e0;
    --dd-surface-border: #2b2f3b;
    --dd-reveal-border: #e3b341;
    --dd-btn: #1f222c;
    --dd-btn-text: #e8e6e0;
    --dd-btn-border: #2b2f3b;
    --dd-chip-label: #8b8fa0;
    --dd-title: #8b8fa0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--dd-page); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { max-width: 480px; margin: 0 auto; padding: 10px 12px 40px; box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  /* Back + number/card display pinned to the top; the active picker centered below */
  #ddScreen { flex: 1; flex-direction: column; }
  #ddScreen #ddNumberPicker, #ddScreen #ddCardPicker, #ddScreen #ddResults { margin-top: auto; margin-bottom: auto; width: 100%; }
  #ddScreen #ddNumberPicker { transform: translateY(7vh); }   /* nudge the numpad down a touch */

  header { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 10px; min-height: 40px; }
  header h1 { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(15px, 5.2vw, 22px); letter-spacing: 1px; color: var(--dd-title); font-weight: 600; text-transform: uppercase; white-space: nowrap; pointer-events: none; }
  header.mag h1 { position: static; flex: 1; font-size: 15px; letter-spacing: .5px; }   /* magician: title flows between the buttons */
  #magExit { flex: none; background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #gearBtn { background: none; border: none; color: var(--dim); font-size: 22px; padding: 4px 8px; cursor: pointer; }
  #tapZone { width: 72px; height: 34px; flex: none; }   /* invisible unlock target, right of the title */
  /* magician-access password gate (shown after the 5-tap unlock) */
  #magPw { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.74); align-items: center; justify-content: center; }
  #magPw.show { display: flex; }
  #magPw .magpw-box { background: var(--panel2,#16161e); border: 1px solid var(--line,#333); border-radius: 16px; padding: 22px; width: min(86vw,320px); box-shadow: 0 14px 44px rgba(0,0,0,.6); }
  #magPw .magpw-title { font-weight: 700; font-size: 17px; text-align: center; color: var(--gold,#d8b25a); margin-bottom: 14px; }
  #magPw input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line,#333); background: #000; color: #fff; text-align: center; }
  #magPw .magpw-err { color: var(--red,#e0544f); font-size: 13px; min-height: 18px; text-align: center; margin-top: 8px; }
  #magPw .magpw-row { display: flex; gap: 10px; margin-top: 12px; }
  #magPw .magpw-row button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line,#333); background: var(--panel2,#222); color: #fff; font-weight: 600; }
  #magPw .magpw-row #magPwOk { background: var(--gold,#d8b25a); color: #000; border-color: var(--gold,#d8b25a); }

  /* step chips */
  #chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 4px; text-align: center; cursor: pointer; }
  .chip .lbl { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .chip .val { font-size: 20px; font-weight: 700; min-height: 26px; margin-top: 2px; }
  .chip.active { border-color: var(--gold); }
  .chip .val.red { color: var(--red); }

  /* pickers */
  .picker { background: var(--panel); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .picker h2 { margin: 0 0 10px; font-size: 12px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }
  .grid { display: grid; gap: 6px; }
  .grid.values { grid-template-columns: repeat(7, 1fr); }
  .grid.suits { grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
  .grid.pad { grid-template-columns: repeat(3, 1fr); max-width: 184px; margin: 0 auto; gap: 5px; }
  .grid.pad button { font-size: 16px; padding: 9px 0; }
  .grid.pad button.ok { background: var(--gold); color: #000; }
  /* the pad doesn't auto-highlight on press; JS lights the key that's ENTERED */
  .grid.pad button:active { background: var(--panel2); color: var(--text); }
  .grid.pad button.lit { background: var(--gold); color: #000; }
  .randombtn { display: block; width: 100%; margin-top: 12px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .randombtn.confirmbtn { background: var(--gold); color: #000; border-color: var(--gold); }
  .rollcard { font-size: 46px; font-weight: 800; min-height: 58px; padding: 6px 0; }
  .rollcard.red { color: var(--red); }
  #numEntry { text-align: center; font-size: 34px; font-weight: 800; min-height: 46px;
    padding: 2px 0 10px; letter-spacing: 2px; }
  .grid button { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; font-size: 17px; font-weight: 600; padding: 11px 0; cursor: pointer; }
  .grid button:active { background: var(--gold); color: #000; }
  .grid.suits button { font-size: 24px; padding: 8px 0; }
  .grid button.suit-h, .grid button.suit-d { color: var(--red); }

  /* results */
  #results { display: none; }
  .banner { background: linear-gradient(135deg, #3a2d0c, #241c08); border: 1px solid var(--gold);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .banner .tag { color: var(--gold); font-size: 11px; letter-spacing: 3px; font-weight: 700; }
  .banner p { margin: 6px 0 0; font-size: 15px; line-height: 1.45; }

  .hero { background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius);
    padding: 18px 16px; margin-bottom: 14px; }
  .hero .score { float: right; color: var(--gold); font-weight: 800; font-size: 14px; }
  .hero .method { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .hero .big { font-size: 21px; font-weight: 700; line-height: 1.35; margin: 10px 0 6px; }
  .hero .ctx { color: var(--dim); font-size: 13px; line-height: 1.4; }
  .steps { margin: 10px 0 8px; padding: 0; list-style: none; counter-reset: st; }
  .steps li { counter-increment: st; display: flex; gap: 12px; font-size: 18px; font-weight: 600;
    line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .steps li:last-child { border-bottom: none; }
  .steps li::before { content: counter(st); color: var(--gold); font-weight: 800; min-width: 18px; }

  .alt { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; }
  .alt .score { float: right; color: var(--dim); font-size: 12px; font-weight: 700; }
  .alt .method { color: var(--dim); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .alt .big { font-size: 14px; line-height: 1.4; margin-top: 4px; }
  .alt .ctx { color: var(--dim); font-size: 12px; margin-top: 3px; }

  .nores { background: var(--panel); border: 1px solid var(--red); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; font-size: 15px; line-height: 1.5; }

  #cheat { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-top: 16px;
    font-size: 13px; color: var(--dim); line-height: 1.7; }
  #cheat b { color: var(--text); }

  .btnrow { display: flex; gap: 8px; margin-bottom: 14px; }
  .btnrow button { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* settings */
  #settings { display: none; }
  .set-group { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .seg { display: flex; gap: 6px; background: #14161d; border: 1px solid var(--dd-btn-border, #2b2f3b); border-radius: 11px; padding: 5px; margin-top: 8px; }
  .seg .segopt { flex: 1; background: transparent; border: none; color: var(--dim); border-radius: 8px; padding: 9px 6px; font-size: 15px; font-weight: 800; line-height: 1.15; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .seg .segopt small { font-weight: 500; font-size: 11px; opacity: .8; text-transform: none; letter-spacing: 0; }
  .seg .segopt.active { background: var(--gold); color: #000; }
  .set-group h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .set-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 14px; }
  .set-row input[type=number] { width: 64px; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 6px; font-size: 14px; text-align: center; }
  .set-row select { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px; font-size: 14px; }
  .set-row .rank { color: var(--gold); font-weight: 800; min-width: 18px; }
  .set-row .mv { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .set-row .mv:disabled { opacity: 0.3; cursor: default; }
  .stackgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 4px; }
  .stackgrid .sc { display: flex; align-items: baseline; gap: 6px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 15px; }
  .stackgrid .sc .pn { color: var(--dim); font-size: 11px; min-width: 17px; text-align: right; }
  .stackgrid .sc .cd { font-weight: 700; }
  .stackgrid .sc .cd.red { color: var(--red); }
  .stackgrid .sc.istop { border-color: var(--gold); }
  .switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 25px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; height: 17px; width: 17px; left: 3px; top: 3px;
    background: var(--dim); border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--gold); border-color: var(--gold); }
  .switch input:checked + .slider:before { transform: translateX(19px); background: #000; }
  .hint { font-size: 11px; color: var(--dim); margin: 2px 0 0; line-height: 1.4; }
  .instr summary { list-style: none; cursor: pointer; outline: none; }
  .instr summary::-webkit-details-marker { display: none; }
  .instr summary::after { content: "  \25B8"; color: var(--dim); font-weight: 400; }
  .instr[open] summary::after { content: "  \25BE"; }
  .instr-body { font-size: 12px; line-height: 1.5; color: #cdd1da; margin-top: 8px; }
  .instr-body p { margin: 6px 0; }
  .instr-body .instr-h { font-weight: 700; color: var(--gold); margin: 12px 0 2px; }
  .instr-body ol, .instr-body ul { margin: 4px 0 8px; padding-left: 20px; }
  .instr-body ul { list-style: disc; }
  .instr-body li { margin: 5px 0; }
  .ts-head { font-size: 15px; font-weight: 700; color: var(--gold); text-align: center; margin: 2px 0 12px; letter-spacing: .3px; line-height: 1.3; }
  .ts-steps { margin: 0; padding-left: 26px; color: #f1f2f5; font-size: 18px; font-weight: 800; line-height: 1.9; letter-spacing: .4px; }
  .ts-steps li { margin: 3px 0; }

  /* ---- constrained-choice magician tool (#ddScreen) — reuses the app's shared .picker/.grid/.chip/.steps styles ---- */
  #ddScreen > h1 { font-size:13px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; margin:8px 0; }
  #ddScreen .row { display:flex; flex-wrap:wrap; gap:6px; }
  #ddScreen #modeSel button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:15px; cursor:pointer; }
  #ddScreen #modeSel button.sel { border-color:var(--gold); color:var(--gold); }
  #ddScreen #ddChips { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:12px; }
  #ddScreen #ddNumEntry { text-align:center; font-size:34px; font-weight:800; min-height:46px; padding:2px 0 10px; letter-spacing:2px; }
  #ddScreen #suitsel button, #ddScreen #ddGaffFlow button { transition: background .15s, color .15s, border-color .15s; }
  #ddScreen #suitsel button.lit, #ddScreen #ddGaffFlow button.lit { background: var(--gold); color:#000; border-color: var(--gold); }
  #ddScreen #ddGaffFlow button { font-size: 20px; font-weight: 600; padding: 22px 0; }
  #ddScreen #ddReveal { text-align: center; font-size: 19px; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
  #ddScreen #ddReveal:empty { display: none; }
  #ddPop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8,9,12,.97); pointer-events: none; opacity: 0; transition: opacity .22s ease; z-index: 70; }
  #ddPop.show { opacity: 1; pointer-events: auto; transition: none; }   /* cover instantly (no fade-in flash); fade-out uses the base transition */
  #ddPop .bubble { background: rgba(18,20,26,.96); border: 1px solid var(--gold); color: #fff; border-radius: 18px; padding: 32px 30px; font-size: 30px; font-weight: 700; line-height: 1.3; max-width: 92%; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,.65); transform: scale(.96); transition: transform .16s ease; }
  #ddPop.show .bubble { transform: scale(1); }
  #ddPop .bubble.final { color: var(--gold); font-size: 32px; padding: 32px 30px; line-height: 1.25; }
  #ddPop .bubble .popcard { display: block; height: 210px; width: auto; max-width: 70vw; margin: 18px auto 0; }
  #ddScreen #ddReveal .revealcard { display: block; height: 160px; width: auto; max-width: 80%; margin: 14px auto 4px; }
  #ddScreen #ddGaffFlow button.off { pointer-events: none; }   /* wrong suit: looks the same, no tap/flash */
  #ddScreen #ddGaffFlow .sy { font-size: 1.7em; vertical-align: -0.12em; }
  #ddScreen #ddGaffFlow .syr { color: var(--red); }
  /* suit step: full card name on one line (shrink to fit), suit icon centred on the next line */
  #ddScreen #ddGaffFlow button[data-g="suit"] { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px; }
  #ddScreen #ddGaffFlow button[data-g="suit"] .cn { white-space: nowrap; display: block; width: 100%; box-sizing: border-box; text-align: center; overflow: hidden; line-height: 1.1; font-weight: 800; text-transform: none; }
  #ddScreen #ddGaffFlow .sy.sb { display: block; vertical-align: 0; line-height: 1; }
  /* colour step: white buttons, black/red content like real card colours */
  #ddScreen #ddGaffFlow button[data-g="color"] { background: var(--dd-btn); border-color: var(--dd-btn); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* ---- card spreads above the equivoque options ---- */
  #ddScreen #ddGaffFlow.flow-cells { display: grid; gap: 16px; }
  #ddScreen #ddGaffFlow.flow-shared { display: block; }
  #ddScreen .optcell { background: var(--dd-btn); border: 2px solid #474d5e; border-radius: 12px; padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  #ddScreen .optcell:active { border-color: var(--gold); }
  #ddScreen .optcell[data-g="value"] { border-color: var(--dd-btn-border); }   /* pairs keep the lighter/subtle border */
  #ddScreen .optcell .optlbl { font-size: 15px; font-weight: 700; color: var(--dd-btn-text); text-align: center; line-height: 1.15; text-transform: none; }
  #ddScreen .optcell[data-g="color"] .optlbl { font-size: 22px; }
  #ddScreen .optcell[data-g="suit"] .optlbl { width: 100%; }
  #ddScreen .optcell[data-g="suit"] .cn { display: block; width: 100%; white-space: nowrap; overflow: hidden; }
  #ddScreen .optcell[data-g="suit"] .pngcard { display: block; height: 150px; width: auto; max-width: 100%; margin: 0 auto 8px; object-fit: contain; }
  #ddScreen .pngpair { display: flex; justify-content: center; align-items: center; margin-bottom: 4px; }
  #ddScreen .pngpair img { width: 84px; height: auto; display: block; filter: drop-shadow(1px 1px 2px rgba(0,0,0,.55)); transform-origin: bottom center; }
  #ddScreen .pngpair img:first-child { transform: rotate(-5deg); }
  #ddScreen .pngpair img + img { margin-left: -52px; transform: rotate(5deg); }
  #ddScreen .optrow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  #ddScreen .mfan { width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 3px 1px; }
  #ddScreen .mfan-in { display: flex; align-items: center; transform-origin: center center; }
  #ddScreen .mc { display: block; flex: none; transform-origin: bottom center; filter: drop-shadow(1px 1px 2px rgba(0,0,0,.5)); }
  #ddScreen .mc.r { color: var(--red); }
  #ddScreen .mc .corner { position: absolute; line-height: .82; font-weight: 800; text-align: center; }
  #ddScreen .mc .corner.tl { top: 5%; left: 8%; }
  #ddScreen .mc .corner.br { bottom: 5%; right: 8%; transform: rotate(180deg); }
  #ddScreen .mc .corner .r, #ddScreen .mc .corner .s { display: block; }
  #ddScreen .mc .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  #ddScreen .picker { background: var(--dd-panel); }               /* panel behind the buttons (baby blue / deep slate) */
  #ddScreen .picker h2 { color: var(--dd-panel-label); text-align: center; font-size: 19px; letter-spacing: 1px; margin-bottom: 14px; }   /* bigger question labels */
  #ddScreen .picker h2.patter { text-transform: none; font-size: 16px; line-height: 1.4; letter-spacing: 0; font-weight: 600; color: #fff; }   /* magician teleprompter patter */
  #ddScreen #ddNumEntry, #ddScreen #ddNumExample { color: var(--dd-panel-label); }
  #ddScreen button { background: var(--dd-btn); color: var(--dd-btn-text); border-color: var(--dd-btn-border); text-transform: capitalize; }
  /* reveal (results) on the surface theme; the green "keep the stack" step survives via its own class rule */
  #ddScreen #out { background: var(--dd-surface); color: var(--dd-surface-text); border-color: var(--dd-reveal-border); }
  /* deadman's switch: hold the title (the header receives it; the h1 is pointer-events:none) to spell out the reveal procedure */
  header { touch-action: none; -webkit-user-select: none; user-select: none; }
  #ddScreen .chip { background: var(--dd-surface); border-color: var(--dd-surface-border); }
  #ddScreen .chip .lbl { color: var(--dd-chip-label); }
  #ddScreen .chip .val { color: var(--dd-surface-text); }
  #ddScreen .chip .val .sy { font-size: 1.5em; vertical-align: -0.1em; }
  #ddScreen .chip .val .syr { color: var(--red); }
  #ddScreen #ddGaffFlow button[data-g="color"][data-v="black"] { color: var(--dd-btn-text); }
  #ddScreen #ddGaffFlow button[data-g="color"][data-v="red"] { color: var(--red); }
  /* give the number keypad the same gold tap-flash as the other buttons (overrides the main app's no-flash pad rule) */
  #ddScreen #keypad { max-width: 340px; gap: 8px; }
  #ddScreen #keypad button { transition: background .15s, color .15s; font-size: 24px; padding: 22px 0; }
  #ddScreen #keypad button:active { background: var(--gold); color: #000; }
  /* last step green = the deal keeps the stack in order (face-up-safe); normal = deal face down */
  #ddScreen .steps li.keep, #ddScreen .steps li.keep::before { color: var(--green); }
  #ddScreen .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:8px; }
  #ddScreen .panel.gold { border-color:var(--gold); }
  #ddScreen .ok { color:var(--green); } #ddScreen .warn { color:var(--gold); } #ddScreen .bad { color:var(--red); }
  #ddScreen .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  #ddScreen details { margin-top:10px; } #ddScreen summary { color:var(--dim); font-size:12px; cursor:pointer; }
  #ddScreen .stackgrid { display:grid; grid-template-columns:repeat(13,1fr); gap:3px; font-size:11px; margin-top:6px; }
  #ddScreen .stackgrid span { text-align:center; padding:2px 0; border:1px solid var(--line); border-radius:4px; }
  #ddScreen .stackgrid span.r { color:var(--red); }

  /* ---- Lockscreen covert view (#lockScreen) — vertical clock + fingerprint sit OVER the hidden 8/5/2 keys ---- */
  #lockScreen { position: fixed; inset: 0; background: linear-gradient(160deg,#0b1020,#05070d 60%,#000);
    color: #fff; z-index: 50; font-family: -apple-system, system-ui, sans-serif; max-width: none; }
  #lkTop { position: absolute; top: 9%; left: 0; right: 0; text-align: left; padding-left: 7vw; }
  #lkDate { font-size: 5.2vw; color: rgba(255,255,255,.9); font-weight: 500; }
  #lkWeather { margin-top: 1.5vh; font-size: 5vw; color: rgba(255,255,255,.8); letter-spacing: 1px; }
  #lkWeather.u { text-decoration: underline; text-underline-offset: 3px; }

<script>
/*ENGINE-START*/
const STACKS = {
  aronson:   ["JS","KC","5C","2H","9S","AS","3H","6C","8D","AC","10S","5H","2D","KD","7D","8C","3S","AD","7S","5S","QD","AH","8S","3D","7H","QH","5D","7C","4H","KH","4D","10D","JC","JH","10C","JD","4S","10H","6H","3C","2S","9H","KS","6S","4C","8H","9C","QS","6D","QC","2C","9D"],
  mnemonica: ["4C","2H","7D","3C","4H","6D","AS","5H","9S","2S","QH","3D","QC","8H","6S","5S","9H","KC","2D","JH","3S","8S","6H","10C","5D","KD","2C","3H","8D","5C","KS","JD","8C","10S","KH","JC","7S","10H","AD","4S","7H","4D","AC","9C","JS","QD","7C","QS","10D","6C","AH","9D"],
  // computer-optimized for this app (see optimize.js): 4 dead pairs in split
  // mode (all at number 52) vs Aronson's 66; 10x fewer pairs needing the less
  // clean variants (THE/no-"of" spellings, double lifts).
  oracle: ["5S","7D","4H","QD","3D","7H","9C","6S","AD","JH","KH","8C","QS","8H","10H","8S","QC","AC","6D","10C","2H","3C","9D","3H","4D","7C","4S","5H","JD","3S","8D","7S","5C","2C","AS","6H","10S","JC","10D","KD","9H","QH","JS","KC","6C","AH","2S","KS","2D","9S","5D","4C"],
};
const STACK_LABELS = { aronson: "Aronson", mnemonica: "Mnemonica", oracle: "Oracle (optimized)" };
const ARONSON = STACKS.aronson; // default stack for standalone helpers
const stackArr = S => STACKS[(S && S.stack)] || ARONSON;

const VAL_NAMES = { A:"ACE", "2":"TWO", "3":"THREE", "4":"FOUR", "5":"FIVE", "6":"SIX", "7":"SEVEN",
  "8":"EIGHT", "9":"NINE", "10":"TEN", J:"JACK", Q:"QUEEN", K:"KING" };
const SUIT_NAMES = { C:"CLUBS", H:"HEARTS", S:"SPADES", D:"DIAMONDS" };
const SUIT_SYM = { C:"♣", H:"♥", S:"♠", D:"♦" };

const ONES = ["","ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE"];
const TEENS = ["TEN","ELEVEN","TWELVE","THIRTEEN","FOURTEEN","FIFTEEN","SIXTEEN","SEVENTEEN","EIGHTEEN","NINETEEN"];
const TENS = { 2:"TWENTY", 3:"THIRTY", 4:"FORTY", 5:"FIFTY" };

function numberWord(n) {
  if (n < 10) return ONES[n];
  if (n < 20) return TEENS[n - 10];
  const t = Math.floor(n / 10), o = n % 10;
  return TENS[t] + (o ? " " + ONES[o] : "");
}
function letterCount(s) { return (s.match(/[A-Z]/g) || []).length; }

function splitCard(card) { // "10H" -> {v:"10", s:"H"}
  return { v: card.slice(0, -1), s: card.slice(-1) };
}
function prettyCard(card) {
  const { v, s } = splitCard(card);
  return v + SUIT_SYM[s];
}
function cardWords(card) {
  const { v, s } = splitCard(card);
  return VAL_NAMES[v] + " OF " + SUIT_NAMES[s];
}
// full English name, e.g. "4D" -> "Four of Diamonds"
function cardFull(card) {
  const { v, s } = splitCard(card);
  const tc = w => w.charAt(0) + w.slice(1).toLowerCase();
  return tc(VAL_NAMES[v]) + " of " + tc(SUIT_NAMES[s]);
}
// Phrasing variants for spelling a card
function cardPhrases(card) {
  const { v, s } = splitCard(card);
  const vn = VAL_NAMES[v], sn = SUIT_NAMES[s];
  return [
    { label: vn + " OF " + sn,           letters: letterCount(vn + sn) + 2, mod: 0,            modKey: null },
    { label: "THE " + vn + " OF " + sn,  letters: letterCount(vn + sn) + 5, mod: "phraseThe",  modKey: "phraseThe" },
    { label: vn + " " + sn,              letters: letterCount(vn + sn),     mod: "phraseNoOf", modKey: "phraseNoOf" },
  ];
}

// 1-based position from the top of the face-down deck, allowing for a cut deck
// (topCard = whichever stack card is currently on top).
function stackPos(card, topCard, stack) {
  const A = stack || ARONSON;
  const i = A.indexOf(card), t = A.indexOf(topCard || A[0]);
  if (i < 0 || t < 0) return -1;
  return ((i - t + 52) % 52) + 1;
}

const SETTINGS_VERSION = 4; // bump when the default scoring model changes
const DEFAULT_SETTINGS = {
  version: SETTINGS_VERSION,
  // Spectator-facing default: a Mnemonica deck in full order, no sleights —
  // self-working so anyone can perform it on themselves. The magician unlocks
  // their own stack/mode via 6 title taps (those choices persist per device).
  stack: "mnemonica",
  topCard: "4C",
  mode: "full",     // "full" | "half" (split into two 26-packets) | "cut" (spectator cuts, you glimpse)
  noteEnd: "top",   // in cut mode: did you glimpse the "top" or "bottom" card?
  // spellCount (spell the card first, then count to the number) sits just above
  // its sibling dealSpellCard so it's the preferred presentation when both hit.
  base: { deal: 100, directReveal: 90, indicator: 75, indicatorBack: 72, spellCount: 71, dealSpellCard: 70,
          countCut: 65, dealSpellBack: 65, dealCountBack: 60, spellNumber: 60, dealSpellNumBack: 55, spellCard: 40 },
  // face-up dealing and a simple off-by-one (turn the next card) are barely
  // penalized; the double lift (offBefore) stays a real cost since it's a
  // sleight; digit sum is a heavy fallback so cleaner methods win when present.
  mod: { face: -3, offNext: -3, offBefore: -12, cross: -4, phraseThe: -3, phraseNoOf: -5,
         cutCard: -15, jokers: -10, digitSum: -25 },
  enabled: { deal: true, directReveal: true, indicator: true, indicatorBack: true, dealSpellCard: true,
             spellCount: true, countCut: true, dealSpellBack: true,
             dealCountBack: true, spellNumber: true, dealSpellNumBack: true, spellCard: true,
             face: true, offNext: true, offBefore: false, phraseThe: true, phraseNoOf: true,
             cutCard: true, jokers: false, digitSum: true, aceShim: false },
  // spectator-facing defaults above; the magician preset (Aronson/half/jokers/aces)
  // is applied on first unlock — see applyMagicianPreset(). Public visitors never unlock.
  magicianReady: false,
};

// input: { c1, n1, c2, n2 }  (cards like "7H", numbers 1-52; any subset)
// Returns candidates sorted best-first, each with a `steps` array.
// opts.inner suppresses the move recursion (cuts / jokers);
// opts.jokers ("top"|"face") counts two jokers added to that end of the deck.
function findOuts(input, settings, opts) {
  const S = settings || DEFAULT_SETTINGS;
  const O = opts || {};
  if (!O.inner && !O.packet && !O.fullDeck) {
    if (S.mode === "half") return findOutsHalfMode(input, S);
    if (S.mode === "cut") return findOutsCutMode(input, S);
  }
  const out = [];
  const STACK = stackArr(S);
  const P = O.packet; // {start, size}: search within one packet of the split deck
  const deckSize = P ? P.size : (O.jokers ? 54 : 52);
  const noun = P ? "packet" : "deck";
  const rawPos = c => stackPos(c, S.topCard, STACK);
  const pos = c => rawPos(c) - (P ? P.start - 1 : 0);
  const inZone = card => !P || (rawPos(card) >= P.start && rawPos(card) <= P.start + P.size - 1);
  const eff = (p, orient) => P
    ? (orient === "top" ? p : P.size + 1 - p)
    : (orient === "top" ? p : 53 - p) + (O.jokers === orient ? 2 : 0);
  // Reverse lookup: which card sits at effective position q? (null = off the
  // deck, or a joker sits there)
  const cardAtEff = (q, orient) => {
    let e = q;
    if (!P && O.jokers === orient) { e -= 2; if (e < 1) return null; }
    const zoneSize = P ? P.size : 52;
    if (e < 1 || e > zoneSize) return null;
    const zonePos = orient === "top" ? e : zoneSize + 1 - e;
    const raw = zonePos + (P ? P.start - 1 : 0);
    return STACK[(STACK.indexOf(S.topCard || STACK[0]) + raw - 1) % 52];
  };

  const orients = S.enabled.face ? ["top", "face"] : ["top"];
  const offsets = [{ d: 0, key: null }];
  if (S.enabled.offNext) offsets.push({ d: 1, key: "offNext" });
  if (S.enabled.offBefore) offsets.push({ d: -1, key: "offBefore" });

  // Spectator 2 (or any field) may be absent — search whatever was given.
  // In packet mode only cards inside this packet are reachable.
  const cards = [];
  if (input.c1 && inZone(input.c1)) cards.push({ card: input.c1, who: 1 });
  if (input.c2 && inZone(input.c2)) cards.push({ card: input.c2, who: 2 });
  const nums = [];
  if (input.n1) nums.push({ num: input.n1, who: 1 });
  if (input.n2) nums.push({ num: input.n2, who: 2 });
  const pairings = [];
  for (const c of cards) for (const n of nums)
    pairings.push({ card: c.card, num: n.num, cardWho: c.who, numWho: n.who, own: c.who === n.who });

  // Stack-preserving handlings: off the top deal FACE UP (flip the packet back
  // to restore); off the face deal FACE DOWN. The reversing handlings are used
  // only by the into-the-dealt-pile family.
  const hold = o => o === "top" ? `Hold the ${noun} FACE DOWN.` : `Hold the ${noun} FACE UP.`;
  const facing = o => o === "top" ? "face up" : "face down";      // stack-preserving deals
  const facingU = o => o === "top" ? "FACE UP" : "FACE DOWN";     // uppercased, for step text
  const revFacing = o => o === "top" ? "FACE DOWN" : "FACE UP";   // reversing deals
  const dealStep = (n, o) => `Deal ${n} cards ${facingU(o)} on the table.`;
  const spellStep = (label, o) => `Spell "${label}" one card ${facingU(o)} per each letter.`;
  // the final reveal of the selection, by arrival offset
  const reveal = (card, off) => off === -1
    ? `With a DOUBLE LIFT reveal the ${cardFull(card)}.`
    : off === 1 ? `The ${cardFull(card)} will be the NEXT CARD.`
    : `ARRIVE at the ${cardFull(card)}.`;
  const pairCtx = p => p.own
    ? `Spectator ${p.cardWho}'s card at their own number`
    : `Spectator ${p.cardWho}'s card at Spectator ${p.numWho}'s number`;

  function push(method, baseKey, orient, off, scoreExtra, steps, ctx, tags, card) {
    let score = S.base[baseKey];
    if (orient === "face") score += S.mod.face;
    if (off.key) score += S.mod[off.key];
    score += scoreExtra;
    out.push({ score, method, orient, offset: off.d, steps, title: steps.join(" "),
               ctx, tags: tags || [], card });
  }

  // 0. Instant reveal — the named card is already on top or is the face card.
  if (S.enabled.directReveal) {
    for (const c of cards) {
      const cardTxt = prettyCard(c.card);
      const mk = steps => out.push({ score: S.base.directReveal, method: "Instant reveal",
        orient: steps.faceCard ? "face" : "top", offset: 0, steps: steps.list,
        title: steps.list.join(" "), ctx: `Spectator ${c.who}'s card — no counting, no number needed`,
        tags: [], card: c.card });
      if (eff(pos(c.card), "top") === 1)
        mk({ list: [`Hold the ${noun} face down.`, `Snap your fingers.`,
                    `Turn over the top card — the ${cardFull(c.card)}!`] });
      if (eff(pos(c.card), "face") === 1)
        mk({ faceCard: true, list: [`Hold the ${noun} face down.`, `Snap your fingers.`,
                    `Turn the ${noun} face up — the ${cardFull(c.card)} is on the face!`] });
    }
  }

  for (const p of pairings) {
    const ep = { top: eff(pos(p.card), "top"), face: eff(pos(p.card), "face") };
    const crossExtra = p.own ? 0 : S.mod.cross;
    const cardTxt = prettyCard(p.card);
    const who = ` — S${p.cardWho}'s card`;

    for (const orient of orients) {
      for (const off of offsets) {
        // One short needs the double lift, which needs unseen faces — dealing
        // off the face shows every card, so it's top-orientation only.
        if (orient === "face" && off.d === -1) continue;
        // 1. Straight deal to the number
        if (S.enabled.deal && ep[orient] === p.num + off.d) {
          const steps = off.d === -1
            ? [hold(orient), `Deal ${p.num} cards FACE DOWN into your hands.`, reveal(p.card, off.d)]
            : [hold(orient), dealStep(p.num, orient), reveal(p.card, off.d)];
          push("Deal to the number", "deal", orient, off, crossExtra, steps,
            pairCtx(p), p.own && off.d === 0 && orient === "top" ? ["MIRACLE"] : [], p.card);
        }
        // 2. Spell the number instead of dealing it (one-short spells are unusable)
        if (S.enabled.spellNumber && off.d !== -1) {
          const w = numberWord(p.num), t = letterCount(w);
          if (ep[orient] === t + off.d) {
            push("Spell the number", "spellNumber", orient, off, crossExtra,
              [hold(orient),
               spellStep(w.replace(/ /g, "-"), orient),
               reveal(p.card, off.d)],
              pairCtx(p), [], p.card);
          }
        }
        // 2b. Indicator card: deal to the number and arrive (directly or off by
        // one) at a spot card 2-10 — its value bridges to the named card.
        // Two conventions: REMOVE the indicator then deal v (target q+v), or
        // RETURN it to the deck then deal v (it deals as #1, target q+v-1).
        if (S.enabled.indicator && off.d !== -1) {
          const q = p.num + off.d;
          const ind = cardAtEff(q, orient);
          const v = ind ? parseInt(splitCard(ind).v, 10) : NaN;
          if (ind && ind !== p.card && v >= 2 && v <= 10) {
            const indFull = cardFull(ind);
            const intro = [hold(orient), dealStep(p.num, orient),
              off.d === 0 ? `Card #${p.num} is the ${indFull} — an INDICATOR.`
                          : `The NEXT card is the ${indFull} — an INDICATOR.`];
            if (ep[orient] === q + v) {
              push("Deal to an indicator card", "indicator", orient, off, crossExtra,
                [...intro,
                 `REMOVE the ${indFull}, then deal ${v} more cards.`,
                 reveal(p.card, 0)],
                pairCtx(p) + ` via indicator ${prettyCard(ind)} (removed)`, [], p.card);
            }
            if (ep[orient] === q + v - 1) {
              push("Deal to an indicator card", "indicator", orient, off, crossExtra,
                [...intro,
                 `REPLACE the ${indFull} on top, then deal ${v} cards.`,
                 reveal(p.card, 0)],
                pairCtx(p) + ` via indicator ${prettyCard(ind)} (returned)`, [], p.card);
            }
          }
        }
        // 3. Deal the number, then spell the card (one-short spells are unusable)
        if (S.enabled.dealSpellCard && off.d !== -1) {
          for (const ph of cardPhrases(p.card)) {
            if (ph.modKey && !S.enabled[ph.modKey]) continue;
            const t = p.num + ph.letters;
            if (t + off.d >= 1 && t + off.d <= deckSize && ep[orient] === t + off.d) {
              push("Deal, then spell the card", "dealSpellCard", orient, off,
                crossExtra + (ph.modKey ? S.mod[ph.modKey] : 0),
                [hold(orient),
                 dealStep(p.num, orient),
                 spellStep(ph.label, orient),
                 reveal(p.card, off.d)],
                pairCtx(p), [], p.card);
            }
          }
        }
        // 3b. Spell the card FIRST, then count to the number (same depth,
        // reversed order — spell an indifferent-looking word, then count to
        // their freely-named number and arrive on the card).
        if (S.enabled.spellCount) {
          for (const ph of cardPhrases(p.card)) {
            if (ph.modKey && !S.enabled[ph.modKey]) continue;
            const t = ph.letters + p.num;
            if (t + off.d >= 1 && t + off.d <= deckSize && ep[orient] === t + off.d) {
              const tail = off.d === -1
                ? [`Then count ${p.num} cards FACE DOWN into your hands.`, reveal(p.card, off.d)]
                : [`Then count ${p.num} more cards.`, reveal(p.card, off.d)];
              push("Spell the card, then count to the number", "spellCount", orient, off,
                crossExtra + (ph.modKey ? S.mod[ph.modKey] : 0),
                [hold(orient),
                 spellStep(ph.label, orient),
                 ...tail],
                pairCtx(p), [], p.card);
            }
          }
        }
      }
    }
  }

  // 4. Count S1's number, cut, count S2's number (uses BOTH numbers; sum must fit)
  if (S.enabled.countCut && input.n1 && input.n2) {
    const sum = input.n1 + input.n2;
    for (const c of cards) {
      const cardTxt = prettyCard(c.card);
      for (const orient of orients) {
        for (const off of offsets) {
          if (orient === "face" && off.d === -1) continue; // double lift needs unseen faces
          if (sum + off.d >= 2 && sum + off.d <= deckSize && eff(pos(c.card), orient) === sum + off.d) {
            const restore = orient === "top"
              ? "Flip the counted cards FACE DOWN and cut them to the bottom."
              : `Turn the counted cards FACE UP and tuck them behind the ${noun}.`;
            const ending = off.d === -1
              ? [`Deal ${input.n2} cards FACE DOWN into your hands.`, reveal(c.card, off.d)]
              : [`Count ${input.n2} more cards.`, reveal(c.card, off.d)];
            push("Count, cut, count again", "countCut", orient, off, 0,
              [hold(orient),
               `Count ${input.n1} cards ${facingU(orient)} — a miss.`,
               restore, ...ending],
              `Spectator ${c.who}'s card via both numbers (${input.n1} + ${input.n2})`, [], c.card);
          }
        }
      }
    }
  }

  // 5. Into the dealt pile: dealing a number reverses those cards, so pile
  // position j holds the card that was at effective position (firstCount − j + 1).
  const dealtPileIntro = (a, orient) => [hold(orient),
    `Deal ${a.num} cards ${revFacing(orient)} into a pile — this reverses their order.`];

  // 5a. ...then count the other number into the dealt pile
  if (S.enabled.dealCountBack) {
    for (const a of nums) for (const b of nums) {
      if (a === b) continue;
      for (const c of cards) {
        const cardTxt = prettyCard(c.card);
        for (const orient of orients) {
          const ep = eff(pos(c.card), orient);
          for (const off of offsets) {
            // a face-orientation dealt pile is face up — no double lift off it
            if (orient === "face" && off.d === -1) continue;
            const j = b.num + off.d; // position reached inside the pile
            if (a.num <= deckSize && j >= 1 && j <= a.num && ep === a.num - j + 1) {
              const ending = off.d === -1
                ? [`Count ${b.num} cards off the pile into your hands.`, reveal(c.card, off.d)]
                : [`Count ${b.num} cards into the dealt pile.`, reveal(c.card, off.d)];
              push("Deal, then count into the dealt pile", "dealCountBack", orient, off, 0,
                [...dealtPileIntro(a, orient), ...ending],
                `Spectator ${c.who}'s card via both numbers (${a.num} − ${b.num})`, [], c.card);
            }
          }
        }
      }
    }
  }

  // 5a2. ...or the top of the dealt pile IS the indicator: deal the number
  // FACE DOWN, the pile's top card is a spot card 2-10 — count back into the
  // pile. Top orientation only: a face-up deal would show the selection pass
  // by before counting back. Three variants:
  //   RETURN it to the pile, count v  -> position (number − value + 1)
  //   REMOVE it, count v              -> position (number − value)
  //   RETURN + count v into YOUR hands, double lift -> (number − value + 2)
  if (S.enabled.indicatorBack) {
    for (const a of nums) {
      if (a.num > deckSize) continue;
      const ind = cardAtEff(a.num, "top");
      const v = ind ? parseInt(splitCard(ind).v, 10) : NaN;
      if (!(v >= 2 && v <= 10)) continue;
      const indTxt = prettyCard(ind);
      const indFull = cardFull(ind);
      const intro = [...dealtPileIntro(a, "top"),
        `Turn over the TOP card of the pile — the ${indFull}, an INDICATOR.`];
      for (const c of cards) {
        if (c.card === ind) continue;
        const ep = eff(pos(c.card), "top");
        const ctx = `Spectator ${c.who}'s card via indicator ${indTxt} atop the dealt pile`;
        if (v <= a.num && ep === a.num - v + 1) {
          push("Deal, then indicator into the dealt pile", "indicatorBack", "top", { d: 0, key: null }, 0,
            [...intro, `REPLACE the ${indFull} FACE DOWN on the pile, then count ${v} cards off it.`,
             reveal(c.card, 0)], ctx + " (returned)", [], c.card);
        }
        if (v < a.num && ep === a.num - v) {
          push("Deal, then indicator into the dealt pile", "indicatorBack", "top", { d: 0, key: null }, 0,
            [...intro, `REMOVE the ${indFull}, then count ${v} cards off the pile.`,
             reveal(c.card, 0)], ctx + " (removed)", [], c.card);
        }
        if (S.enabled.offBefore && v <= a.num && ep === a.num - v + 2) {
          push("Deal, then indicator into the dealt pile", "indicatorBack", "top", { d: -1, key: "offBefore" }, 0,
            [...intro, `REPLACE the ${indFull} FACE DOWN, then count ${v} cards off the pile into your hands.`,
             reveal(c.card, -1)], ctx + " (double lift)", [], c.card);
        }
      }
    }
  }

  // 5b. ...then spell the card into the dealt pile
  if (S.enabled.dealSpellBack) {
    for (const p of pairings) {
      const cardTxt = prettyCard(p.card);
      const a = { num: p.num, who: p.numWho };
      for (const ph of cardPhrases(p.card)) {
        if (ph.modKey && !S.enabled[ph.modKey]) continue;
        for (const orient of orients) {
          const ep = eff(pos(p.card), orient);
          for (const off of offsets) {
            if (off.d === -1) continue; // one-short spell is unusable
            const j = ph.letters + off.d;
            if (p.num <= deckSize && j >= 1 && j <= p.num && ep === p.num - j + 1) {
              push("Deal, then spell the card into the dealt pile", "dealSpellBack", orient, off,
                (p.own ? 0 : S.mod.cross) + (ph.modKey ? S.mod[ph.modKey] : 0),
                [...dealtPileIntro(a, orient),
                 `Spell "${ph.label}" one card per each letter into the dealt pile.`,
                 reveal(p.card, off.d)],
                pairCtx(p), [], p.card);
            }
          }
        }
      }
    }
  }

  // 5c. ...then spell a number into the dealt pile (spelling the SAME number
  // just dealt is allowed — "deal 30, now spell T-H-I-R-T-Y")
  if (S.enabled.dealSpellNumBack) {
    for (const a of nums) for (const b of nums) {
      const w = numberWord(b.num), L = letterCount(w);
      for (const c of cards) {
        const cardTxt = prettyCard(c.card);
        const cross = (a === b && c.who !== a.who) ? S.mod.cross : 0;
        for (const orient of orients) {
          const ep = eff(pos(c.card), orient);
          for (const off of offsets) {
            if (off.d === -1) continue; // one-short spell is unusable
            const j = L + off.d;
            if (a.num <= deckSize && j >= 1 && j <= a.num && ep === a.num - j + 1) {
              push("Deal, then spell a number into the dealt pile", "dealSpellNumBack", orient, off, cross,
                [...dealtPileIntro(a, orient),
                 `Spell "${w.replace(/ /g, "-")}" one card per each letter into the dealt pile.`,
                 reveal(c.card, off.d)],
                a === b ? `Spectator ${c.who}'s card; deal then spell the same number (${a.num})`
                        : `Spectator ${c.who}'s card via both numbers (${a.num}, spell ${b.num})`, [], c.card);
            }
          }
        }
      }
    }
  }

  // 6. Pure card spell (ignores the numbers)
  if (S.enabled.spellCard) {
    for (const c of cards) {
      const cardTxt = prettyCard(c.card);
      for (const ph of cardPhrases(c.card)) {
        if (ph.modKey && !S.enabled[ph.modKey]) continue;
        for (const orient of orients) {
          for (const off of offsets) {
            if (off.d === -1) continue; // one-short spell is unusable
            if (eff(pos(c.card), orient) === ph.letters + off.d) {
              push("Spell the card", "spellCard", orient, off, ph.modKey ? S.mod[ph.modKey] : 0,
                [hold(orient),
                 spellStep(ph.label, orient),
                 reveal(c.card, off.d)],
                `Spectator ${c.who}'s card by spelling (numbers unused)`, [], c.card);
            }
          }
        }
      }
    }
  }

  // 7. Moves: adjust the deck first, then use any other method. Never combined
  // with each other (one move max per out), and never inside a packet.
  if (!O.inner && !P) {
    // 7a. Cut a named card to the top or bottom. The stack is cyclic, so a cut
    // is just a new rotation. A cut is only ever used to find the OTHER card —
    // openly cutting to a card and then revealing it gives the method away.
    if (S.enabled.cutCard) {
      for (const c of cards) {
        const idx = STACK.indexOf(c.card);
        for (const place of ["top", "bottom"]) {
          const newTop = place === "top" ? c.card : STACK[(idx + 1) % 52];
          if (newTop === (S.topCard || "JS")) continue; // already there — plain results cover it
          const placeTxt = place === "top" ? "TOP" : "BOTTOM (face)";
          for (const r of findOuts(input, { ...S, topCard: newTop }, { inner: true })) {
            if (r.card === c.card) continue;
            const steps = [`Casually cut the ${cardFull(c.card)} to the ${placeTxt} of the deck.`,
                           ...r.steps];
            out.push({ ...r, score: r.score + S.mod.cutCard, method: "Cut + " + r.method,
              steps, title: steps.join(" "),
              ctx: r.ctx + ` — after cutting S${c.who}'s ${prettyCard(c.card)} to the ${place}`,
              tags: [] });
          }
        }
      }
    }
    // 7b. Add both jokers to the top or the face: every count from that end
    // shifts by 2. Only results on the joker side are new — the rest are
    // duplicates of the plain search.
    if (S.enabled.jokers) {
      for (const place of ["top", "face"]) {
        for (const r of findOuts(input, S, { inner: true, jokers: place })) {
          if (r.orient !== place) continue;
          const steps = [`Add BOTH Jokers to the ${place === "top" ? "TOP" : "FACE (bottom)"} of the deck.`,
                         ...r.steps];
          out.push({ ...r, score: r.score + S.mod.jokers, method: "Jokers + " + r.method,
            steps, title: steps.join(" "),
            ctx: r.ctx + " — with both Jokers added", tags: [] });
        }
      }
    }
  }

  // 8. Digit sum: replace a two-digit named number with the sum of its digits
  // (47 -> 4+7 -> 11) and run the count-based methods at that smaller number.
  // A clean, fair-sounding transformation that rescues most hard numbers.
  if (S.enabled.digitSum && !O.inner && !O.viaSum && !P) {
    const NUMBER_METHODS = new Set(["Deal to the number", "Deal, then spell the card",
      "Spell the card, then count to the number", "Deal to an indicator card",
      "Deal, then indicator into the dealt pile"]);
    for (const slot of ["n1", "n2"]) {
      const n = input[slot];
      if (!n || n < 10) continue;
      const ds = String(n).split("").reduce((a, b) => a + +b, 0);
      if (ds === n) continue;
      const framing = `Add the digits of ${n} (${String(n).split("").join(" + ")} = ${ds}).`;
      // fullDeck bypasses the half/cut re-dispatch; viaSum blocks nested digit-sum
      const useRe = new RegExp("(Deal|count) " + ds + "(?!\\d)");
      for (const r of findOuts({ ...input, [slot]: ds }, S, { viaSum: true, fullDeck: true })) {
        const base = r.method.replace(/^(Cut|Jokers) \+ /, "");
        if (!NUMBER_METHODS.has(base)) continue; // only outs that actually use the number
        // place "Add the digits…" right before the step that uses the reduced count
        let at = r.steps.findIndex(st => useRe.test(st));
        if (at < 0) at = 0;
        const steps = [...r.steps.slice(0, at), framing, ...r.steps.slice(at)];
        out.push({ ...r, score: r.score + S.mod.digitSum, method: "Digit sum + " + r.method,
          steps, title: steps.join(" "), ctx: r.ctx + ` — via the digit sum of ${n}` });
      }
    }
  }

  out.sort((a, b) => b.score - a.score);
  return out;
}

// Half-deck mode: the deck starts split into two packets of 26. Every out
// begins by reassembling the deck — REPLACE (original order) or CUT (bottom
// half on top). Both are clean cyclic states of the stack, so this opening is
// free, and the full-deck search (moves included) runs under each.
function findOutsHalfMode(input, S) {
  const out = [];
  const STACK = stackArr(S);
  const topIdx = STACK.indexOf(S.topCard || STACK[0]);
  for (const ord of [{ top: S.topCard || STACK[0], label: "REPLACE the top pile back to the top." },
                     { top: STACK[(topIdx + 26) % 52], label: "CUT the bottom pile to the top." }]) {
    for (const r of findOuts(input, { ...S, topCard: ord.top }, { fullDeck: true })) {
      const steps = [ord.label, ...r.steps];
      out.push({ ...r, steps, title: steps.join(" "),
        ctx: r.ctx + (ord.top === (S.topCard || "JS") ? "" : " — after the cut reassembly") });
    }
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

// Spectator-cut mode: the spectator cuts and completes the cut; the magician
// secretly glimpses the card now on top (or bottom). That glimpse fixes the
// rotation, so the full-deck search runs at it. settings.topCard holds the
// glimpsed card; if it was the bottom card, the real top is the next stack card.
function findOutsCutMode(input, S) {
  const STACK = stackArr(S);
  const glimpsed = S.topCard || STACK[0];
  let effTop = glimpsed, open;
  if (S.noteEnd === "bottom") {
    effTop = STACK[(STACK.indexOf(glimpsed) + 1) % 52];
    open = `Spectator cuts & completes the cut — you've secretly glimpsed the ${cardFull(glimpsed)} on the BOTTOM.`;
  } else {
    open = `Spectator cuts & completes the cut — you've secretly glimpsed the ${cardFull(glimpsed)} on TOP.`;
  }
  const out = [];
  for (const r of findOuts(input, { ...S, mode: "full", topCard: effTop }, { fullDeck: true })) {
    const steps = [open, ...r.steps];
    out.push({ ...r, steps, title: steps.join(" "), ctx: r.ctx + " — after the spectator's cut" });
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

// Compact run-length range string: [23,24,25,31,51,52] -> "23–25, 31, 51–52"
function formatRanges(nums) {
  const s = [...nums].sort((a, b) => a - b);
  if (!s.length) return "";
  const parts = [];
  let a = s[0], prev = s[0];
  for (let i = 1; i <= s.length; i++) {
    if (i < s.length && s[i] === prev + 1) { prev = s[i]; continue; }
    parts.push(a === prev ? `${a}` : `${a}–${prev}`);
    a = prev = s[i];
  }
  return parts.join(", ");
}

// Scan all 52 numbers for a card: which are dead, which give the strongest
// outs. One sweep powers the dead-zone ranges and "best numbers" hints.
function scanCard(card, settings) {
  const S = settings || DEFAULT_SETTINGS;
  const dead = [], score = {}, forced = [];
  let max = 0;
  for (let n = 1; n <= 52; n++) {
    const r = findOuts({ c1: card, n1: n }, S);
    if (!r.length) { dead.push(n); continue; }
    score[n] = r[0].score;
    if (r[0].score > max) max = r[0].score;
    // "non-optimal": the best available procedure is a contrived one — a
    // digit-sum transformation or a double lift (one-short).
    if (r[0].method.includes("Digit sum") || r[0].offset === -1) forced.push(n);
  }
  const cut = Math.min(max, 90);
  const best = Object.keys(score).filter(n => score[n] >= cut).map(Number);
  return { dead, best, forced, max, score };
}

// The best card-only reveal that needs no number AND no moves — i.e. the card
// is sitting on top or on the face. Returns null otherwise (spelling to the
// card is deliberately not surfaced here).
function instantReveal(card, settings) {
  return findOuts({ c1: card }, settings).find(o => o.method === "Instant reveal") || null;
}

// Numbers 1-52 with no out at all for this card.
function deadNumbers(card, settings) { return scanCard(card, settings).dead; }

// Detect the rare "double miracle": both cards land exactly at numbers, dealing
// face down from the top, so one deal reveals both.
function findDoubleMiracle(input, settings) {
  const S = settings || DEFAULT_SETTINGS;
  if (!input.c1 || !input.c2 || !input.n1 || !input.n2) return null;
  if (input.c1 === input.c2) return null;
  const ST = stackArr(S);
  const combos = [
    { a: { card: input.c1, num: input.n1 }, b: { card: input.c2, num: input.n2 }, cross: false },
    { a: { card: input.c1, num: input.n2 }, b: { card: input.c2, num: input.n1 }, cross: true },
  ];
  for (const c of combos) {
    const pa = stackPos(c.a.card, S.topCard, ST), pb = stackPos(c.b.card, S.topCard, ST);
    if (pa === c.a.num && pb === c.b.num && c.a.num !== c.b.num) {
      const first = c.a.num < c.b.num ? c.a : c.b;
      const second = c.a.num < c.b.num ? c.b : c.a;
      return {
        text: `DOUBLE MIRACLE — deal FACE UP from the top: card #${first.num} is the ${prettyCard(first.card)}` +
              ` and card #${second.num} is the ${prettyCard(second.card)}. One deal, both hits.` +
              (c.cross ? " (Numbers are swapped between spectators.)" : ""),
      };
    }
  }
  return null;
}

// Raw data for improvising when nothing (or something weak) hits.
function cheatSheet(input, settings) {
  const S = settings || DEFAULT_SETTINGS;
  const rows = [];
  for (const [card, who] of [[input.c1, 1], [input.c2, 2]]) {
    if (!card) continue;
    const p = stackPos(card, S.topCard, stackArr(S));
    const phr = cardPhrases(card).map(ph => `${ph.label}=${ph.letters}`).join(", ");
    const half = S.mode === "half"
      ? (p <= 26 ? ` TOP half #${p} (${27 - p} from its face).` : ` BOTTOM half #${p - 26} (${53 - p} from its face).`)
      : "";
    rows.push(`S${who} ${prettyCard(card)}: position ${p} from top, ${53 - p} from face.${half} Spells: ${phr}`);
  }
  for (const [num, who] of [[input.n1, 1], [input.n2, 2]]) {
    if (!num) continue;
    const w = numberWord(num);
    rows.push(`S${who} number ${num}: "${w}" spells with ${letterCount(w)} letters`);
  }
  if (input.n1 && input.n2)
    rows.push(`Numbers summed: ${input.n1} + ${input.n2} = ${input.n1 + input.n2}`);
  return rows;
}

/* ---- ace-shim search (magician only) ----
   Hold out the 2 jokers + 4 aces. The base deck is the stack minus the aces;
   the magician adds 0/2/4/6 indifferent cards to the top or face. We build each
   candidate deck literally and search every method on it, then rank. */
const ACE_CODES = ["AS", "AH", "AC", "AD"];
const JOKER_CODES = ["JK", "JK"];
function deckSpot(card) {                              // 2..10 indicator value, else null
  if (card === "JK") return null;
  const v = splitCard(card).v;
  if (v === "A" || v === "J" || v === "Q" || v === "K") return null;
  return parseInt(v, 10);
}
function baseDeckNoAces(S) {                           // chosen stack rotated to topCard, aces pulled (48, top first)
  const STACK = stackArr(S), top = (S && S.topCard) || STACK[0], start = STACK.indexOf(top), out = [];
  for (let i = 0; i < 52; i++) out.push(STACK[(start + i) % 52]);
  return out.filter(c => !ACE_CODES.includes(c));
}
// What you can add — always to the DEAL end (the top of the deck as held), so
// the instruction is just "Add JOKERS/ACES". All-or-none groups: 0/2/4/6 cards.

// digit first (21/23/25/20), then the TENS (12/32/52/...).
function fDoubleMisread(tens, lean) {
  for (const dir of (lean || ["right", "left", "down", "up"])) {
    const nd = padDir(tens, dir); if (nd == null) continue;     // units === tens for a double
    if (fHit(tens * 10 + nd)) return tens * 10 + nd;
    if (fHit(nd * 10 + tens)) return nd * 10 + tens;
  }
  return null;
}
function fDumpGarbage(g) {                          // hunt failed → 3-digit garbage to clear
  fumble.phase = "garbage";
  setTimeout(() => { if (fumble && fumble.phase === "garbage") { numEntry = g; $("numEntry").textContent = g; } }, 180);
}

function buildPickers() {
  $("valueGrid").innerHTML = VALUES.map(v => `<button data-v="${v}">${v}</button>`).join("");
  $("suitGrid").innerHTML = SUITS.map(s =>
    `<button data-s="${s}" class="suit-${s.toLowerCase()}">${SUIT_SYM[s]}</button>`).join("");
  $("numberPad").innerHTML = ["1","2","3","4","5","6","7","8","9"].map(d =>
    `<button data-k="${d}">${d}</button>`).join("") +
    `<button data-k="clear">C</button><button data-k="0">0</button>` +
    `<button data-k="ok" class="ok">&#10003;</button>`;

  $("valueGrid").addEventListener("click", e => {
    const v = e.target.dataset?.v; if (!v) return;
    state.pendingValue = v;
    // a manual pick supersedes any rolled card
    state.pendingCard = null; $("cardRoll").style.display = "none";
    $("randomCard").innerHTML = "&#127922; Random card generator";
    [...$("valueGrid").children].forEach(b => b.style.borderColor = b.dataset.v === v ? "var(--gold)" : "var(--line)");
  });
  $("suitGrid").addEventListener("click", e => {
    const s = e.target.dataset?.s; if (!s || !state.pendingValue) return;
    setStepValue(state.pendingValue + s);
    state.pendingValue = null;
    [...$("valueGrid").children].forEach(b => b.style.borderColor = "var(--line)");
  });
  $("numberPad").addEventListener("click", e => {
    const k = e.target.dataset?.k; if (!k) return;
    // where in the key the finger landed → rank the four directions by lean,
    // so a mis-tap correction can pick the neighbour it leaned toward (any axis)
    const r = e.target.getBoundingClientRect();
    if (r.width && e.clientX >= r.left && e.clientX <= r.right) {
      const dx = (e.clientX - r.left) / r.width - 0.5, dy = (e.clientY - r.top) / r.height - 0.5;
      const sc = { right: dx, left: -dx, down: dy, up: -dy };
      lastTapLean = ["right", "left", "down", "up"].sort((a, b) => sc[b] - sc[a]);
    } else lastTapLean = null;
    // manual pad use supersedes a rolled number
    $("numRoll").style.display = "none"; $("randomNum").innerHTML = "&#127922; Random number generator";
    // --- "laggy pad" recovery for a dead-end ---
    //  lag: completing tap dropped, further taps buffer → 3-digit garbage to CLEAR
    //  respond (re-entry): first tap swallowed only if it's the dead number's tens;
    //    each next tap pairs with the held tens — hit commits, dead slides the unit
    //    to be the new tens; 3 dead slides → garbage again; Clear is "misread" as
    //    the 7 above it when tens·7 is a hit.
    if (fumble) {
      if (fumble.phase === "lag") {
        if (/^\d$/.test(k)) { fumble.buf += k; if (fumble.buf.length >= 3) fDumpGarbage(fumble.buf); }
        else if (k === "clear") fEnterRespond();
        return;
      }
      if (fumble.phase === "garbage") {
        if (k === "clear") fEnterRespond();
        return;
      }
      if (fumble.phase === "respond") {
        if (k === "clear") {
          if (fumble.pending != null && fHit(fumble.pending * 10 + 7)) fCommit(fumble.pending * 10 + 7, 7);
          else { fumble.pending = null; fumble.first = true; fumble.dead = 0; fumble.taps = []; numEntry = ""; $("numEntry").textContent = "–"; flashKey("clear"); }
          return;
        }
        if (!/^\d$/.test(k)) return;
        const d = parseInt(k, 10);
        fumble.taps.push(d);
        if (fumble.first) {                            // first tap: swallow only the dead-number's tens
          fumble.first = false; fumble.pending = d;
          numEntry = (d === fumble.deadTens) ? "" : String(d);
          $("numEntry").textContent = numEntry || "–";
          return;
        }
        const pair = fumble.pending * 10 + d;
        if (fHit(pair)) { fCommit(pair, d); return; }  // formed a working number
        // double-tap of the held tens (e.g. 2→22) but that number is dead →
        // "misread" a digit to a working neighbour, leaning the way it was hit
        if (d === fumble.pending) {
          const n = fDoubleMisread(fumble.pending, lastTapLean);
          if (n != null) { fCommitBoth(n); return; }
        }
        fumble.pending = d; fumble.dead++;             // dead → slide the unit to be the new tens
        numEntry = String(d); $("numEntry").textContent = numEntry;
        if (fumble.dead >= 3) fDumpGarbage(fumble.taps.slice(-3).join(""));
        return;
      }
    }
    if (k === "clear") { numEntry = ""; flashKey(k); }
    else if (k === "ok") {
      const v = parseInt(numEntry, 10);
      if (v >= 1 && v <= 52) { completeDigit(v, k); return; }
      flashKey(k);
    } else if (numEntry.length < 2) {
      const next = numEntry + k, v = parseInt(next, 10);
      if (v >= 1) {
        // 6-9 can't start a valid two-digit number (max 52); two digits decide themselves
        if (next.length === 2 || v >= 6) {
          if (v <= 52) { completeDigit(v, k); return; }
          flashKey(k); // 53-59: ignore this digit, keep the tens
        } else { numEntry = next; flashKey(k); }
      } else flashKey(k);
    } else flashKey(k);
    $("numEntry").textContent = numEntry || "–";
  });

  // Random card: each press rolls a new card into the preview; "Use this card"
  // confirms. The spectator can keep re-rolling until they like one.
  $("randomCard").addEventListener("click", () => {
    const pool = bestCards(), cur = state.pendingCard;
    const choices = pool.length > 1 ? pool.filter(c => c !== cur) : pool;  // change every press
    state.pendingCard = choices[Math.floor(Math.random() * choices.length)];
    const pv = $("cardRollPreview");
    pv.textContent = prettyCard(state.pendingCard);
    pv.className = "rollcard" + (/[HD]$/.test(state.pendingCard) ? " red" : "");
    $("cardRoll").style.display = "block";
  });
  $("useCard").addEventListener("click", () => { if (state.pendingCard) setStepValue(state.pendingCard); });

  // Random number: pick one of the card's top 8 numbers (no animation). Each
  // press shows a fresh one; "Use this number" confirms.
  $("randomNum").addEventListener("click", () => {
    if (!state.c1) return;
    fumble = null;
    const pool = topNumbers(state.c1, 8), cur = parseInt(numEntry, 10);
    const choices = pool.length > 1 ? pool.filter(n => n !== cur) : pool;  // change every press
    numEntry = String(choices[Math.floor(Math.random() * choices.length)]);
    $("numEntry").textContent = numEntry;
    $("numRoll").style.display = "block";
  });
  $("useNum").addEventListener("click", () => {
    const v = parseInt(numEntry, 10);
    if (v >= 1 && v <= 52) commitNumber(v);
  });
}

const STEP_KEYS = ["c1", "n1"];
function setStepValue(val) {
  state[STEP_KEYS[state.step]] = val;
  // card entered -> ask for the number; number entered -> results
  if (state.step === 0) {
    // a top/bottom card reveals with no number — skip straight to the result
    state.step = (!magicianMode && instantReveal(val, settings)) ? 2 : 1;
  } else {
    state.step = 2;
  }
  render();
}

function render() {
  // chips
  for (let i = 0; i < 2; i++) {
    const key = STEP_KEYS[i], el = $("chip-" + key), v = state[key];
    el.textContent = v == null ? "—" : (typeof v === "number" ? v : prettyCard(v));
    el.className = "val" + (typeof v === "string" && /[HD]$/.test(v) ? " red" : "");
    el.parentElement.classList.toggle("active", state.step === i);
  }
  $("gearBtn").style.display = magicianMode ? "" : "none";
  // random generators are a spectator aid; the magician types exact values
  $("randomCard").style.display = magicianMode ? "none" : "";
  $("randomNum").style.display = magicianMode ? "none" : "";
  // reset the roll-and-confirm UI on every (re)render — rolling never re-renders
  $("cardRoll").style.display = "none";
  $("numRoll").style.display = "none";
  $("randomCard").innerHTML = "&#127922; Random card generator";
  $("randomNum").innerHTML = "&#127922; Random number generator";
  const isCard = state.step === 0, isNum = state.step === 1;
  $("cardPicker").style.display = isCard ? "" : "none";
  $("numberPicker").style.display = isNum ? "" : "none";
  $("results").style.display = state.step === 2 ? "block" : "none";
  if (isCard) $("cardPickerTitle").textContent = magicianMode ? "Enter their card" : "Enter your card";
  if (isNum) {
    $("numberPickerTitle").textContent = magicianMode ? "Enter their number" : "Enter any number between 1 and 52";
    if (state.step !== lastNumStep) { numEntry = ""; fumble = null; }
    lastNumStep = state.step;
    $("numEntry").textContent = numEntry || "–";
    // The magician's number screen shows the intel banner (strongest numbers,
    // dead zones, forced ranges). Spectators never see it.
    $("partialOut").style.display = magicianMode ? "block" : "none";
    if (magicianMode) {
    // One sweep over all 52 numbers for this card: strongest numbers to steer
    // toward, the dead zones, and the numbers with only a forced procedure.
    const scan = scanCard(state.c1, settings);
    const instant = instantReveal(state.c1, settings);
    const po = $("partialOut");
    po.style.display = "block";
    po.style.marginBottom = "12px";
    po.style.borderColor = scan.dead.length ? "var(--red)" : scan.forced.length ? "var(--amber)" : "var(--green)";
    let html = "";
    const miracleNums = scan.best.filter(n => scan.score[n] === 100);
    const strongNums = scan.best.filter(n => scan.score[n] < 100);
    if (miracleNums.length)
      html += `<div class="tag" style="color:var(--gold)">&#9733; MIRACLE IF THEY NAME</div><p><b>${formatRanges(miracleNums)}</b></p>`;
    if (strongNums.length) {
      const slabel = scan.max >= 90 ? "90+" : scan.max + " pts";
      html += `<div class="tag" style="color:var(--green)">&#9733; STRONGEST OTHER NUMBERS (${slabel})</div><p><b>${formatRanges(strongNums)}</b></p>`;
    }
    // Only surface a no-number reveal when the card is on top/bottom — not a spell.
    if (instant) {
      const sing1 = s => s.replace(/(^|\D)1 (cards|letters|more cards)\b/g, (m,p,w)=>`${p}1 ${w.replace(/s$/,"")}`);
      html += `<div class="tag">&#10022; NO NUMBER NEEDED &mdash; ON TOP/BOTTOM</div>` +
        instant.steps.map(s => `<p>${sing1(s)}</p>`).join("");
    }
    if (scan.dead.length)
      html += `<div class="tag" style="color:var(--red)">&#9888; NO HIT IF THEY NAME</div><p><b>${formatRanges(scan.dead)}</b></p>`;
    if (scan.forced.length)
      html += `<div class="tag" style="color:var(--amber)">&#9651; NO CLEAN PROCEDURE (digit-sum / double lift)</div><p><b>${formatRanges(scan.forced)}</b></p>`;
    if (!scan.dead.length && !scan.forced.length)
      html += `<div class="tag" style="color:var(--green)">&#10003; EVERY NUMBER HAS A CLEAN OUT</div>`;
    po.innerHTML = html;
    } // end magicianMode intel
  }
  if (state.step === 2) (magicianMode ? renderResults : renderSpectatorResults)();
}

function renderResults() {
  const input = { c1: state.c1, n1: state.n1, c2: state.c2, n2: state.n2 };
  if (settings.enabled.aceShim) { renderShimResults(input); return; }
  const outs = findOuts(input, settings);
  const dbl = findDoubleMiracle(input, settings);
  let html = "";

  if (dbl) html += `<div class="banner"><div class="tag">&#9733;&#9733; DOUBLE MIRACLE</div><p>${dbl.text}</p></div>`;

  if (!outs.length) {
    html += `<div class="nores"><b>No clean out.</b> Improvise from the raw data below — or take the deck back, cut, and re-run with a new top card (&#9881; settings).</div>`;
  } else {
    // "Deal 1 cards" -> "Deal 1 card" (only a standalone 1, not 11/21/31…)
    const sing = s => s.replace(/(^|\D)1 (cards|letters|more cards)\b/g,
      (m, p, w) => `${p}1 ${w.replace(/s$/, "")}`);
    const stackNote = r => (r.method.includes("dealt pile") || r.offset === -1)
      ? " · dealt packet ends reversed" : " · stack order survives";
    const badge = r => `${r.tags.includes("MIRACLE") ? "&#9733; MIRACLE — " : ""}${r.method}` +
      `${r.orient === "face" ? " · from face" : ""}` +
      `${r.offset === 1 ? " · off by one" : r.offset === -1 ? " · double lift" : ""}`;
    const [top, ...rest] = outs;
    html += `<div class="hero"><span class="score">${top.score}</span>` +
      `<div class="method">${badge(top)}</div>` +
      `<ol class="steps">${top.steps.map(s => `<li>${sing(s)}</li>`).join("")}</ol>` +
      `<div class="ctx">${top.ctx}${stackNote(top)}</div></div>`;
    for (const r of rest.slice(0, 12)) {
      html += `<div class="alt"><span class="score">${r.score}</span>` +
        `<div class="method">${badge(r)}</div>` +
        `<div class="big">${r.steps.map(sing).join(" &rarr; ")}</div><div class="ctx">${r.ctx}${stackNote(r)}</div></div>`;
    }
  }
  $("resultList").innerHTML = html;
  $("cheat").style.display = "";
  $("cheat").innerHTML = "<b>Raw data</b><br>" + cheatSheet(input, settings).join("<br>");
}

// Ace-shim magician results: search every shim configuration; each out leads
// with its "Set up: …" instruction (which cards to add and where).
function renderShimResults(input) {
  const sing = s => s.replace(/(^|\D)1 (cards|letters|more cards)\b/g, (m, p, w) => `${p}1 ${w.replace(/s$/, "")}`);
  // the 4 aces are held out — they can't be placed at a number. Re-ask.
  if (ACE_CODES.includes(input.c1)) {
    $("resultList").innerHTML = `<div class="nores"><b>${prettyCard(input.c1)} is one of the aces you set aside.</b> Ask them to name a different card.</div>`;
    $("cheat").style.display = "none"; $("cheat").innerHTML = "";
    return;
  }
  const outs = findShimOuts({ c1: input.c1, n1: input.n1 }, settings);
  let html = "";
  if (!outs.length) {
    html = `<div class="nores"><b>No out even with the shims.</b> Take the deck back, cut to a new top card, and re-run.</div>`;
  } else {
    const head = r => `<div class="method">${r.method} <span style="color:var(--dim)">· +${r.added} cards</span></div>`;
    const [top, ...rest] = outs;
    html += `<div class="hero"><span class="score">${top.score}</span>${head(top)}` +
      `<ol class="steps">${top.steps.map(s => `<li>${sing(s)}</li>`).join("")}</ol></div>`;
    for (const r of rest.slice(0, 8))
      html += `<div class="alt"><span class="score">${r.score}</span>${head(r)}` +
        `<div class="big">${r.steps.map(sing).join(" &rarr; ")}</div></div>`;
  }
  $("resultList").innerHTML = html;
  $("cheat").style.display = "none"; $("cheat").innerHTML = "";
}

// Spectator-facing results: just the performance steps, no scores / methods /
// alternatives / intel. The two secret codes are folded in by spectatorSteps.
function renderSpectatorResults() {
  const input = { c1: state.c1, n1: state.n1 };
  const outs = findOuts(input, settings);
  $("cheat").innerHTML = "";
  $("cheat").style.display = "none";
  if (!outs.length) {
    $("resultList").innerHTML = `<div class="nores">Hmm — that combination doesn't have a clean revelation. Tap <b>New trick</b> and try another number.</div>`;
    return;
  }
  const sing = s => s.replace(/(^|\D)1 (cards|letters|more cards)\b/g, (m, p, w) => `${p}1 ${w.replace(/s$/, "")}`);
  const steps = spectatorSteps(outs[0]).map(sing);
  $("resultList").innerHTML =
    `<div class="hero"><div class="method" style="color:var(--gold)">Follow these steps</div>` +
    `<ol class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
}

// Methods sorted by base score (ties broken by the METHOD_LABELS order)
function methodRankOrder() {
  const order = Object.keys(METHOD_LABELS);
  return [...order].sort((a, b) => settings.base[b] - settings.base[a] || order.indexOf(a) - order.indexOf(b));
}

// Move a method one rank up/down by swapping base scores with its neighbour
// (on a tie, nudge past it by 1 so the move is visible).
function moveMethod(k, dir) {
  const keys = methodRankOrder();
  const i = keys.indexOf(k), j = i + dir;
  if (j < 0 || j >= keys.length) return;
  const other = keys[j], a = settings.base[k], b = settings.base[other];
  if (a === b) settings.base[k] = b - dir;
  else { settings.base[k] = b; settings.base[other] = a; }
  saveSettings(); renderSettings();
}

  catch (e) { return; }

async function camSave() {
  if (!camChunks.length) return;
  const type = (camRecorder && camRecorder.mimeType) || "video/mp4";
  const blob = new Blob(camChunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";

  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) {}

const CAM_SN = { S:"Spades",C:"Clubs",H:"Hearts",D:"Diamonds" }, CAM_SS = { S:"♠",C:"♣",H:"♥",D:"♦" };
$("camFlow").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.classList.contains("off")) return;
  const g = b.dataset.g, v = b.dataset.v; if (!g) return;
  if (g === "color") camRd.color = v; else if (g === "kind") { camRd.kind = v; camRd.hl = null; }
  else if (g === "hl") camRd.hl = v; else if (g === "value") camRd.value = v;
  else if (g === "suit") { const r = rdSuit(camRd.value, camRd.color, camRd.num); camRd.suitPicked = v; camRd.card = camRd.value + (r.force ? r.suits[0] : v); camRd.step = 2; }   // always resolve to the force card
  camRender();
});
function camFlowStep() { const f = $("camFlow"); let cols = 2, html = "", title = "";
  // full performance script (camera-only — the spectator never sees it)
  const valList = (vals) => { const n = vals.map(v => "JQK".includes(v) ? CAM_VN[v] : v);
    return n.length <= 1 ? "a " + n[0] : n.length === 2 ? "a " + n[0] + " or a " + n[1] : "a " + n.slice(0,-1).join(", ") + ", or a " + n[n.length-1]; };
  if (!camRd.color) { title = "Now for the card — would you like a red card or a black card?";
    html = `<button data-g="color" data-v="black">Black <span class="sy">♠♣</span></button><button data-g="color" data-v="red">Red <span class="sy syr">♥♦</span></button>`; }
  else if (rdHasKind() && !camRd.kind) { const other = camRd.color === "red" ? "black" : "red";
    title = `You want a ${camRd.color} card, so we'll remove all the ${other} cards. Do you want a number card or a picture card?`;
    html = `<button data-g="kind" data-v="num">Number card</button><button data-g="kind" data-v="pic">Picture card</button>`; }
  else if (rdNumMode(camRd) && !camRd.hl) {
    const other = camRd.color === "red" ? "black" : "red";
    title = `You want a ${camRd.color} card, so we'll remove the ${other} cards. Would you like a high card or a low card?`;
    html = `<button data-g="hl" data-v="high">High</button><button data-g="hl" data-v="low">Low</button>`; }
  else if (!camRd.value) {
    const g = rdGroups(camRd.color, camRd.num), vals = camRd.hl === "high" ? g.high : g.low;
    const otherHL = camRd.hl === "high" ? "low" : "high";
    title = `You want a ${camRd.hl} card, so we'll remove the ${otherHL} cards. Would you like ${valList(vals)}?`;
    cols = vals.length;
    html = vals.map(v => `<button data-g="value" data-v="${v}">${"JQK".includes(v) ? CAM_VN[v] : v}</button>`).join("");
  } else { const r = rdSuit(camRd.value, camRd.color, camRd.num);
    const vn = "JQK".includes(camRd.value) ? CAM_VN[camRd.value] : camRd.value;
    const su = camRd.color === "red" ? ["Hearts","Diamonds"] : ["Spades","Clubs"];
    title = r.force
      ? `The ${vn} of ${su[0]} and the ${vn} of ${su[1]}. We started with 52 cards and we're down to 2 — this is your last choice. Imagine you're holding the ${vn} of ${su[0]} and the ${vn} of ${su[1]}; hand me either one… which did you give?`
      : `Final Decision — do you want the ${vn} of ${su[0]} or the ${vn} of ${su[1]}?`;
    html = r.suits.map(s => { const red = "HD".includes(s);
      return `<button data-g="suit" data-v="${s}" class="suit-${s.toLowerCase()}"><span class="cn">${CAM_VN[camRd.value]} of ${CAM_SN[s]}</span><span class="sy${red ? " syr" : ""} sb">${CAM_SS[s]}</span></button>`; }).join("");
  }
  $("camTitle").textContent = title; f.style.gridTemplateColumns = `repeat(${cols},1fr)`; f.innerHTML = html;
}
function camRenderOut() { const o = rdResolve(camRd.card, camRd.num);
  // closing patter: free choice if they named the force card (or both suits worked), otherwise the equivoque line
  const r = rdSuit(camRd.value, camRd.color, camRd.num);
  const freeChoice = !r.force || camRd.suitPicked === r.suits[0];
  const cn = ("JQK".includes(camRd.value) ? CAM_VN[camRd.value] : camRd.value) + " of " + CAM_SN[camRd.card.slice(-1)];
  $("camTitle").textContent = freeChoice
    ? `And that was a free choice — you could have chosen any card, and you chose the ${cn}.`
    : `We started with 52 cards and now you're left holding one card — the ${cn}.`;
  $("camOut").innerHTML = rdThreeStep(o, camRd.card, camRd.num);   // concise 3-step magician view
}
function camRender() {
  $("camKeypad").style.display = camRd.step === 0 ? "" : "none";
  $("camNumEntry").style.display = camRd.step === 0 ? "" : "none";
  $("camFlow").style.display = camRd.step === 1 ? "" : "none";
  $("camOut").style.display = camRd.step === 2 ? "" : "none";
  if (camRd.step === 0) { $("camTitle").textContent = "Name any number between 1 and 52."; $("camNumEntry").textContent = camNumEntry || "–"; camNumGuide(); }
  else $("camGuide").innerHTML = "";
  if (camRd.step === 1) camFlowStep();
  if (camRd.step === 2) camRenderOut();
}

// --- controls ---
$("camExit").addEventListener("click", camHide);
$("camFlip").addEventListener("click", camFlip);
$("camHideBtn").addEventListener("click", () => { $("camScreen").classList.toggle("hideui"); camUpdateHideBtn(); });
$("camRec").addEventListener("click", () => { camRecording ? camStopRec() : camStartRec(); });
$("camRestart").addEventListener("click", () => camReset());   // keeps camera/recording running
$("camBack").addEventListener("click", () => {
  if (camRd.step === 2) { camRd.card = null; camRd.step = 1; return camRender(); }
  if (camRd.step === 1) {
    if (camRd.value) { camRd.value = null; return camRender(); }
    if (camRd.hl) { camRd.hl = null; return camRender(); }
    if (camRd.kind) { camRd.kind = null; return camRender(); }
    if (camRd.color) { camRd.color = null; return camRender(); }
    camRd.step = 0; camNumEntry = ""; return camRender();
  }
});
camOpen = camShow;

rdResetState(); rdRender();   // init (real-deck tool, number step)
})();

buildPickers();
render();
// Deep link: #camera (or #cam) opens camera mode directly; otherwise land on the spectator view.
if (/^#cam(era)?$/i.test(location.hash) && camOpen) {
  camOpen();
} else {
  $("app").style.display = "none";
  $("ddScreen").style.display = "flex";
  if (ddRerender) ddRerender();
}
</script>
</body>
</html>
