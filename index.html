  const f = faceFor(gValue, gColor), correct = f.slice(-1);   // value + colour pins the suit
  [...$("ddGaffFlow").children].forEach(b => b.classList.remove("lit"));
  const btn = $("ddGaffFlow").querySelector(`button[data-v="${correct}"]`); if (btn) btn.classList.add("lit");
  setTimeout(() => { ddState.card = f; goStep(1); }, 450);
}
$("ddGaffFlow").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const g = b.dataset.g, v = b.dataset.v; if (!g) return;
  if (g === "color") gColor = v;
  else if (g === "kind") gKind = v;
  else if (g === "value") gValue = v;
  else if (g === "suit") return pickGaffSuit();
  ddRender();
});
// random card generator (spectator view) — rolls only VALID faces; press again for a fresh one
$("ddRandomCard").addEventListener("click", () => {
  const choices = FACES.length > 1 ? FACES.filter(c => c !== pendingCard) : FACES;
  pendingCard = choices[Math.floor(Math.random() * choices.length)];
  const pv = $("ddCardRollPreview");
  pv.textContent = pretty(pendingCard);
  pv.className = "rollcard" + (isRed(pendingCard) ? " red" : "");
  $("ddCardRoll").style.display = "block";
});
$("ddUseCard").addEventListener("click", () => { if (!pendingCard) return; ddState.card = pendingCard; pendingCard = null; pendingValue = null; styleValues(); goStep(1); });
// random number generator (spectator view) — rolls only WORKING numbers (10–43, clean out)
$("ddRandomNum").addEventListener("click", () => {
  if (!ddState.card) return;
  let pool = []; for (let N = 10; N <= 43; N++) if (resolveOut(ddState.card, N, $("dl").checked)) pool.push(N);
  if (!pool.length) for (let N = 10; N <= 43; N++) pool.push(N);
  const cur = parseInt(numEntry, 10), choices = pool.length > 1 ? pool.filter(n => n !== cur) : pool;
  numEntry = String(choices[Math.floor(Math.random() * choices.length)]);
  $("ddNumEntry").textContent = numEntry;
  $("ddNumRoll").style.display = "block";
});
$("ddUseNum").addEventListener("click", () => { const v = parseInt(numEntry, 10); if (v >= 1 && v <= 52) commitNum(v); });
$("keypad").addEventListener("click", e => {
  const k = e.target.dataset?.k; if (!k) return;
  $("ddNumRoll").style.display = "none";   // manual pad use supersedes a rolled number
  if (k === "clear") numEntry = "";
  else if (k === "ok") { const v = parseInt(numEntry, 10); if (v >= 1 && v <= 52) return commitNum(v); }
  else if (numEntry.length < 2) numEntry += k;
  $("ddNumEntry").textContent = numEntry || "–";
  if (numEntry.length === 2) { const v = parseInt(numEntry, 10); if (v >= 1 && v <= 52) commitNum(v); }
});
function commitNum(v) { ddState.num = v; numEntry = ""; goStep(2); }

$("ddChips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return;
  const st = +c.dataset.step; if (st === 1 && !ddState.card) return; goStep(st); });
$("ddEdit").addEventListener("click", () => goStep(0));
$("ddReset").addEventListener("click", ddReset);
// Back steps through the flow (results→number→card→undo equivoque); only leaves the tool from the very start
$("ddBack").addEventListener("click", () => {
  if (ddState.step === 2) return goStep(1);
  if (ddState.step === 1) { ddState.card = null; return goStep(0); }
  if (mode === "gaff") {
    if (gValue) { gValue = null; ddRender(); return; }
    if (gKind)  { gKind = null;  ddRender(); return; }
    if (gColor) { gColor = null; ddRender(); return; }
  }
  $("ddScreen").style.display = "none"; $("app").style.display = "block"; render();
});
$("modeSel").addEventListener("click", e => { const m = e.target.dataset?.m; if (!m || m === mode) return;
  setDeck(m); [...$("modeSel").children].forEach(b => b.classList.toggle("sel", b.dataset.m === m));
  renderStack(); updateModeNote(); ddReset();
});
$("dl").addEventListener("change", () => { if (ddState.step === 2) ddRender(); });

function goStep(s) { ddState.step = s; if (s === 1) numEntry = ""; if (s === 0) resetGaff(); ddRender(); }
function ddReset() { ddState.step = 0; ddState.card = null; ddState.num = null; pendingValue = null; numEntry = ""; resetGaff(); styleValues(); ddRender(); }

function renderStack() { $("stackGrid").innerHTML = STACK.map(c => `<span class="${isRed(c) ? "r" : ""}">${pretty(c)}</span>`).join(""); }
function updateModeNote() {
  $("modeNote").innerHTML = mode === "gaff"
    ? `<b>Gaff:</b> 24 faces ×2. Free value <b>2–K</b> + "red or black" → suit is pinned; tap the named card (only its two valid suits enable). Force a number <b>10–43</b> — every card is a clean hit. Hold out 2 jokers + 4 aces; if they name an Ace, ask for another.`
    : `<b>Regular (Aronson):</b> name any value <b>2–K</b> + suit. Aces held out (with 2 jokers) as shims, so if they name an Ace ask for another. Single-copy deck, so coverage is lower — some cards have a few <b>excluded numbers</b> (shown), handled with "don't think of my number". Dealing face up is always safe.`;
}
function setCodedVisibility(coded) {
  const dn = coded ? "none" : "";
  $("ddTitle").style.display = dn;
  $("modeSel").style.display = dn;
  $("ddDlLabel").style.display = dn;
  $("ddDetails").style.display = dn;
}
function renderOut(coded) {
  const f = ddState.card, N = ddState.num;
  const out = (f && N >= 1 && N <= 52) ? resolveOut(f, N, $("dl").checked) : null;
  // steps; the LAST step is green when the deal can keep the stack in order (face-up-safe), normal otherwise
  const stepsHtml = o => { const st = stepsFor(o, f, N, coded);
    return `<ol class="steps">${st.map((line, i) => `<li class="${i === st.length - 1 && o.faceUp ? "keep" : ""}">${line}</li>`).join("")}</ol>`; };
  if (coded) { $("out").innerHTML = out ? stepsHtml(out) : `<span class="hint">—</span>`; return; }
  if (!out) { $("out").innerHTML = `<span class="bad">No clean out for ${pretty(f)} at ${N}.</span> <span class="hint">${N < 10 || N > 43 ? "Outside the forced range — redirect to a two-digit number under 44." : "Steer them off this number."}</span>`; return; }
  const tierName = out.tier === 0 ? "clean deal" : out.tier === 1 ? "double-lift" : "indicator";
  const oor = (N < 10 || N > 43) ? `<span class="warn"> · outside 10–43 — redirect if you can</span>` : "";
  $("out").innerHTML = `<div class="hint">${pretty(f)} at ${N} · ${tierName}${oor}</div>${stepsHtml(out)}`;
}
function ddRender() {
  const coded = !magicianMode;
  // chips
  $("ddChipCard").innerHTML = ddState.card ? pretty(ddState.card) : "—";
  $("ddChipCard").className = "val" + (ddState.card && isRed(ddState.card) ? " red" : "");
  $("ddChipNum").textContent = ddState.num != null ? ddState.num : "—";
  $("ddChips").children[0].classList.toggle("active", ddState.step === 0);
  $("ddChips").children[1].classList.toggle("active", ddState.step === 1);
  if (coded && ddState.step !== 2) {   // entry: only the card chip, and only once it's entered
    $("ddChips").style.gridTemplateColumns = "1fr";
    $("ddChips").children[1].style.display = "none";
    $("ddChips").style.display = ddState.card ? "" : "none";
  } else {   // magician, or the end (results): show card + number on top
    $("ddChips").style.gridTemplateColumns = "";
    $("ddChips").children[1].style.display = "";
    $("ddChips").style.display = "";
  }
  // no Back button on the very first (landing) page — nothing to go back to
  const atRoot = ddState.step === 0 && !gColor && !gKind && !gValue;
  $("ddBack").parentElement.style.display = (coded && atRoot) ? "none" : "";
  $("ddNumTitle").textContent = coded ? "Enter any number between 1 and 52" : "Enter their number";
  // panels by step
  $("ddCardPicker").style.display = ddState.step === 0 ? "" : "none";
  $("ddNumberPicker").style.display = ddState.step === 1 ? "" : "none";
  $("ddResults").style.display = ddState.step === 2 ? "" : "none";
  // card picker contents: gaff uses the guided equivoque flow; regular uses the value grid + suits
  if (mode === "gaff") {
    $("vals").style.display = "none"; $("suitsel").style.display = "none"; $("ddGaffFlow").style.display = "";
    renderGaffStep();   // sets the card title per sub-step
  } else {
    $("vals").style.display = ""; $("suitsel").style.display = ""; $("ddGaffFlow").style.display = "none";
    $("ddCardTitle").textContent = coded ? "Enter your card" : "Enter their card";
  }
  setCodedVisibility(coded);
  // random generators removed from the spectator view
  $("ddRandomCard").style.display = "none";
  $("ddRandomNum").style.display = "none";
  $("ddCardRoll").style.display = "none";
  $("ddNumRoll").style.display = "none";
  [...$("suitsel").children].forEach(b => b.classList.remove("lit"));
  if (ddState.step === 1) {
    $("ddNumEntry").textContent = numEntry || "–";
    if (coded) $("numGuide").innerHTML = "";
    else { const f = ddState.card, duds = f ? faceDuds($("dl").checked, 43)[f] : [];
      $("numGuide").innerHTML = duds.length ? `<span class="warn">avoid ${duds.join(", ")}</span>` : `<span class="ok">any 10–43 works</span>`; }
  }
  if (ddState.step === 2) renderOut(coded);
}
ddRerender = ddRender;

/* ---- Lockscreen covert view (gaff): hidden-keypad input, disguised date/code ---- */
let lkValue = null, lkColor = null, lkNum = "", lkPhase = "value", lkTimer = null, lkWeatherTxt = "--°";
// invisible numpad — calculator layout so the middle column reads 8/5/2 top→bottom under the clock:
//   J Q K / 7 8 9 / 4 5 6 / 1 2 3 / 10 0 C
const LK_KEYS = [["J",0,0],["Q",1,0],["K",2,0],["7",0,1],["8",1,1],["9",2,1],
                 ["4",0,2],["5",1,2],["6",2,2],["1",0,3],["2",1,3],["3",2,3],
                 ["10",0,4],["0",1,4],["clr",2,4]];
$("lkZones").innerHTML = LK_KEYS.map(([k,cx,ry]) =>
  `<div class="z" data-k="${k}" style="left:${(cx*33.34).toFixed(2)}%;top:${(14+ry*17).toFixed(1)}%;width:33.34%;height:17%"><span class="zl">${k==="clr"?"C":k}</span></div>`).join("");
$("lkZones").addEventListener("click", e => { const z = e.target.closest(".z"); if (z) lkTap(z.dataset.k); });
$("lkExit").addEventListener("click", lkHide);                                         // tap top-left: exit
$("lkSetup").addEventListener("click", () => $("lkZones").classList.toggle("debug"));   // tap top-right: reveal the hidden zones
// the clock digits & fingerprint ARE the tap targets for the keys they cover (8 / 5 / 2)
$("lkHrs").addEventListener("click", () => lkTap("8"));
$("lkMins").addEventListener("click", () => lkTap("5"));
$("lkFinger").addEventListener("click", () => lkTap("2"));

function lkTap(k) {
  if (k === "clr") { lkReset(); return; }
  if (lkPhase === "value") {
    let v = null;
    if (k === "10") v = "10";
    else if (k === "J" || k === "Q" || k === "K") v = k;
    else if (k >= "2" && k <= "9") v = k;
    else return;                                   // "1"=Ace (excluded) / "0" ignored here
    lkValue = v; lkPhase = "color"; lkRenderDate();
  } else if (lkPhase === "color") {
    if (["J","7","4","1","10"].includes(k)) lkColor = "black";   // left column
    else if (["K","9","6","3"].includes(k)) lkColor = "red";     // right column
    else return;                                                 // middle column: ignore, wait for a side
    lkPhase = "number"; lkRenderDate();
  } else {                                          // number
    if (lkNum.length >= 2 || !/^[0-9]$/.test(k)) return;         // J/Q/K/10 ignored; 2-digit max
    lkNum += k; lkRenderDate();
  }
}
function lkReset() { lkValue=null; lkColor=null; lkNum=""; lkPhase="value"; lkRenderDate(); }
function lkStartClock() { lkTick(); lkTimer = setInterval(lkTick, 1000); }
function lkStopClock() { if (lkTimer) clearInterval(lkTimer); lkTimer = null; }
function lkTick() { const t = new Date();
  $("lkHrs").textContent = String(t.getHours()).padStart(2,"0");
  $("lkMins").textContent = String(t.getMinutes()).padStart(2,"0");
  lkRenderDate(t); }
function lkRenderDate(t) {
  t = t || new Date();
  const wd = t.toLocaleDateString(undefined,{weekday:"short"});
  const mo = t.toLocaleDateString(undefined,{month:"short"});
  const face = (lkValue && lkColor) ? faceFor(lkValue, lkColor) : null;
  // feedback: show the value as soon as it's tapped (before colour), then the full card
  const dayTxt = face ? face : (lkValue ? lkValue : String(t.getDate()));
  const yearTxt = lkNum ? lkNum.padEnd(2,"_") : String(t.getFullYear());
  $("lkDate").textContent = `${wd}, ${mo} ${dayTxt}  ${yearTxt}`;
  lkRenderCode(face);
}
function lkRenderCode(face) {
  const w = $("lkWeather"), N = parseInt(lkNum,10);
  if (face && N >= 1 && N <= 52) { const out = resolveOut(face, N, $("dl").checked);
    if (out) { const e = encodeOut(out); w.textContent = e.code; w.classList.toggle("u", e.faceDown); return; } }
  w.classList.remove("u"); w.textContent = lkWeatherTxt;
}
function lkFetchWeather() {
  const put = (lat,lon) => fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit`)
    .then(r=>r.json()).then(d=>{ lkWeatherTxt = Math.round(d.current.temperature_2m)+"°"; if(!$("lkWeather").classList.contains("u")) $("lkWeather").textContent = lkWeatherTxt; }).catch(()=>{});
  fetch("https://ipapi.co/json/").then(r=>r.json()).then(l=>put(l.latitude,l.longitude)).catch(()=>{});
}
function lkShow() { setDeck("gaff"); $("app").style.display="none"; $("settings").style.display="none"; $("ddScreen").style.display="none"; $("lockScreen").style.display="block"; lkReset(); lkStartClock(); lkFetchWeather(); }
function lkHide() { $("lockScreen").style.display="none"; lkStopClock(); $("app").style.display="block"; }
lkOpen = lkShow;

renderStack(); updateModeNote(); ddReset();   // init (gaff mode, step 0)
})();

buildPickers();
render();
// Default landing: the duplicate-gaff spectator (coded) view.
$("app").style.display = "none";
$("ddScreen").style.display = "block";
if (ddRerender) ddRerender();
</script>
</body>
</html>
